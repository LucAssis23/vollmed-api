name: Deploy Voll Med

on:
  push:
    branches: [ "main" ]
  
jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Configura JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Roda o Docker Compose
      run: docker compose up -d

    - name: Deploy para EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        USER: ubuntu
        HOST: 3.148.117.249
      run: |
        echo "$PRIVATE_KEY" > deploy.key.pem
        chmod 600 deploy_key.pem

        docker save -o vollmed-api.tar vollmed-api_api

        scp -o StrictHostKeyChecking=mo -i deploy_key.pem vollmed-api.tar $USER@$HOST:/home/ubuntu/
        scp -o StrictHostKeyChecking=mo -i deploy_key.pem init.sql $USER@$HOST:/home/ubuntu/
        scp -o StrictHostKeyChecking=mo -i deploy_key.pem docker-compose-prod.yaml $USER@$HOST:/home/ubuntu/
        scp -o StrictHostKeyChecking=mo -i deploy_key.pem script-deploy.sh $USER@$HOST:/home/ubuntu/

        ssh -i deploy_key.pem $USER@$HOST "chmod +x script-deploy.sh && ./script-deploy.sh"
