name: CI Voll Med

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Configura JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Roda o Docker Compose
      run: docker compose up -d

    - name: Executa testes e gera Relatório Jacoco
      run: mvn jacoco:prepare-agent verify

    - name: Analise estática
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=LucAssis23_vollmed-api

